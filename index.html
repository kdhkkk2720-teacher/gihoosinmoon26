<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기후 변화 모둠 신문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 수업 정보 띠 → 모둠 선택 카드 6개 → 신문 지면(기사) + 오른쪽 분석 패널. 교사용 검토는 별도 화면. */
:root{
  --bg:#eef2f1; --surface:#ffffff; --paper:#fbfaf6; --ink:#17201d; --muted:#5a6661; --line:#d3dbd8;
  --accent:#1d5c86; --accent-ink:#ffffff; --accent-soft:#dfeaf2;
  --c-cause:#1f6fb2; --h-cause:#d7e8f8;
  --c-state:#6b4fa3; --h-state:#e8e0f6;
  --c-effect:#b2650f; --h-effect:#fbe7c8;
  --c-resp:#2e7d4f; --h-resp:#d6efdf;
  --add:#a14d5c;
  --f-head:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#18211e; --paper:#1c2522; --ink:#e6ece9; --muted:#9aa8a2; --line:#2e3a36;
  --accent:#6fb0dc; --accent-ink:#0d1a22; --accent-soft:#1d3342;
  --c-cause:#7ab6ea; --h-cause:#1d3a56;
  --c-state:#b49de0; --h-state:#33294a;
  --c-effect:#e9a75a; --h-effect:#4a3416;
  --c-resp:#74c995; --h-resp:#173d27;
  --add:#e3909e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#18211e; --paper:#1c2522; --ink:#e6ece9; --muted:#9aa8a2; --line:#2e3a36;
  --accent:#6fb0dc; --accent-ink:#0d1a22; --accent-soft:#1d3342;
  --c-cause:#7ab6ea; --h-cause:#1d3a56;
  --c-state:#b49de0; --h-state:#33294a;
  --c-effect:#e9a75a; --h-effect:#4a3416;
  --c-resp:#74c995; --h-resp:#173d27;
  --add:#e3909e; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:20px 48px}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.meta{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px}
.meta h1{font-family:var(--f-head);font-size:1.7rem;margin:0;text-wrap:balance;line-height:1.25}
.meta .sub{color:var(--muted);font-size:.85rem;letter-spacing:.02em}
.viewtoggle{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.viewtoggle button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:.88rem}
.viewtoggle button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}

.groups{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-block:16px}
.gbtn{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;display:grid;gap:2px;min-width:0}
.gbtn .n{font-size:.75rem;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.gbtn .r{font-weight:600;font-size:.92rem;line-height:1.35}
.gbtn .t{font-size:.78rem;color:var(--muted)}
.gbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.gbtn[aria-pressed="true"] .n{color:var(--accent)}
@media (max-width:900px){.groups{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.groups{grid-template-columns:repeat(2,minmax(0,1fr))}}

.main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:1fr}}

.paper{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:26px 30px 30px}
@media (max-width:480px){.paper{padding:18px 16px 22px}}
.mast{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;border-bottom:3px double var(--ink);padding-bottom:6px;font-size:.78rem;color:var(--muted);letter-spacing:.04em}
.mast b{color:var(--ink);font-family:var(--f-head);font-size:.95rem;letter-spacing:.08em}
.kicker{margin-top:16px;font-size:.8rem;font-weight:700;color:var(--accent);letter-spacing:.05em}
.paper h2{font-family:var(--f-head);font-size:1.75rem;line-height:1.3;margin:4px 0 8px;text-wrap:balance}
.dek{font-family:var(--f-head);font-size:1.05rem;color:var(--muted);margin:0 0 14px;line-height:1.55}
.byline{font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:6px;margin-bottom:16px}
.article p{font-family:var(--f-head);font-size:1.06rem;line-height:1.95;margin:0 0 1em;max-width:62ch}
.article h3{font-family:var(--f-body);font-size:.95rem;margin:1.4em 0 .4em;color:var(--ink)}
.fact{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:4px 0 20px}
.fact div{border-top:2px solid var(--ink);padding-top:6px}
.fact .v{font-family:var(--f-body);font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums;line-height:1.2}
.fact .l{font-size:.78rem;color:var(--muted);line-height:1.4}

/* 하이라이트 */
.article [data-t]{border-radius:3px;transition:background-color .2s}
.article.show-cause [data-t="cause"]{background:var(--h-cause);box-shadow:0 2px 0 var(--c-cause)}
.article.show-state [data-t="state"]{background:var(--h-state);box-shadow:0 2px 0 var(--c-state)}
.article.show-effect [data-t="effect"]{background:var(--h-effect);box-shadow:0 2px 0 var(--c-effect)}
.article.show-resp [data-t="resp"]{background:var(--h-resp);box-shadow:0 2px 0 var(--c-resp)}
.add{text-decoration:underline dotted var(--add);text-underline-offset:4px}
.add::after{content:"보충";font-family:var(--f-body);font-size:.62rem;font-weight:700;color:var(--add);vertical-align:super;margin-left:2px}
@media (prefers-reduced-motion:reduce){.article [data-t]{transition:none}}

.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--paper);display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-block:8px;margin:-4px 0 10px;border-bottom:1px solid var(--line)}
.tools .lab{font-size:.78rem;color:var(--muted);margin-right:4px}
.hl{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.hl i{width:10px;height:10px;border-radius:50%;display:inline-block}
.hl[data-k="cause"] i{background:var(--c-cause)} .hl[data-k="state"] i{background:var(--c-state)}
.hl[data-k="effect"] i{background:var(--c-effect)} .hl[data-k="resp"] i{background:var(--c-resp)}
.hl[aria-pressed="true"][data-k="cause"]{border-color:var(--c-cause);background:var(--h-cause)}
.hl[aria-pressed="true"][data-k="state"]{border-color:var(--c-state);background:var(--h-state)}
.hl[aria-pressed="true"][data-k="effect"]{border-color:var(--c-effect);background:var(--h-effect)}
.hl[aria-pressed="true"][data-k="resp"]{border-color:var(--c-resp);background:var(--h-resp)}
.hl.all{border-style:dashed}

.note{font-size:.8rem;color:var(--muted);border-left:3px solid var(--add);padding:6px 10px;margin-top:18px;background:var(--surface)}

.side{display:grid;gap:14px;min-width:0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.box h4{margin:0 0 10px;font-size:.95rem}
.box h4 small{font-weight:500;color:var(--muted);margin-left:6px}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.steps .k{font-size:.72rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap;margin-top:2px}
.steps p{margin:0;font-size:.9rem}
.who{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.who span{font-size:.72rem;border-radius:4px;padding:1px 6px;background:var(--bg);color:var(--muted)}
.think{margin:0;padding-left:1.1em;font-size:.9rem;display:grid;gap:6px}
.src{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.src li{display:grid;gap:3px;border-top:1px solid var(--line);padding-top:10px}
.src li:first-child{border-top:0;padding-top:0}
.src a{font-weight:600;font-size:.9rem;line-height:1.4;text-decoration:none}
.src a:hover{text-decoration:underline}
.src .pub{font-size:.76rem;color:var(--muted)}
.cov{display:flex;gap:4px;flex-wrap:wrap}
.cov span{font-size:.7rem;font-weight:600;border-radius:4px;padding:0 6px;border:1px solid var(--line);color:var(--muted)}
.cov span.y{color:var(--ink)}
.cov span.y[data-k="cause"]{background:var(--h-cause);border-color:var(--c-cause)}
.cov span.y[data-k="state"]{background:var(--h-state);border-color:var(--c-state)}
.cov span.y[data-k="effect"]{background:var(--h-effect);border-color:var(--c-effect)}
.cov span.y[data-k="resp"]{background:var(--h-resp);border-color:var(--c-resp)}
.cov span.p{border-style:dashed;color:var(--ink)}

/* 교사용 */
.review{display:grid;gap:18px;margin-top:18px}
.review .box p{margin:.3em 0;font-size:.92rem;max-width:80ch}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:.86rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
thead th{font-size:.76rem;letter-spacing:.04em;color:var(--muted);background:var(--bg);position:sticky;top:0}
td.m{text-align:center;font-weight:700;width:64px}
td.m.y{color:var(--c-resp)} td.m.p{color:var(--c-effect)} td.m.n{color:var(--muted);font-weight:400}
tr.gh td{background:var(--accent-soft);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted)}
</style>

</head>
<body>
<div class="wrap">
  <header class="meta">
    <div>
      <div class="sub">사회② 8-2-2 · 우리나라의 기후 변화 · 숭곡중학교 2학년</div>
      <h1>기후 변화 모둠 신문</h1>
    </div>
    <div class="viewtoggle" role="group" aria-label="화면 선택">
      <button id="v-student" aria-pressed="true">모둠 기사 읽기</button>
      <button id="v-teacher" aria-pressed="false">교사용 검토</button>
    </div>
  </header>

  <section id="studentView">
    <nav class="groups" id="groups" aria-label="모둠 선택"></nav>
    <div class="main">
      <article class="paper" id="paper"></article>
      <aside class="side" id="side"></aside>
    </div>
  </section>

  <section id="teacherView" class="review" hidden></section>
</div>

<script>
const K = {cause:"원인", state:"현황", effect:"영향", resp:"대응 방안"};
const S = (t, s) => `<span data-t="${t}">${s}</span>`;
const A = (t, s) => `<span data-t="${t}" class="add">${s}</span>`;

const G = [
{
  id:"g1", n:"1모둠", region:"설악산·팔공산", type:"산간 관광지 · 단풍 시기 변화", sheet:"단풍이 드는 시기가 늦어짐",
  kicker:"산간 관광지 | 강원 설악산 · 대구 팔공산",
  title:"늦게 물드는 단풍, 축제 달력도 다시 쓴다",
  dek:"가을 늦더위로 단풍 시작과 절정이 해마다 늦어지면서, 관광객과 상인, 지방자치단체가 모두 계획을 바꾸고 있다.",
  facts:[["최대 8일","2026년 설악산 첫 단풍, 평년보다 늦어진 기간"],["+2.3℃","최근 5년 9월 평균기온, 1990년대 대비"],["20% 미만","2024년 팔공산 단풍축제 당시 단풍 든 비율"]],
  body:`
<p>${S("state","올해 첫 단풍은 9월 30일 무렵 강원 설악산에서 시작될 것으로 예보됐다. 평년보다 최대 8일 늦은 시기다. 지리산과 내장산도 평년보다 각각 8일, 7일가량 늦게 물들 전망이다.")} ${S("state","산림청 관측에 따르면 단풍 절정 시기도 최근 10년 평균보다 4~5일 늦어졌고, 단풍나무류는 해마다 약 0.4일씩 늦어지는 추세다.")} ${A("state","단풍이 늦게 시작되면서 단풍을 즐길 수 있는 기간과 가장 아름다운 시기도 해마다 달라지고 있다.")}</p>
<h3>왜 늦어질까</h3>
<p>${S("cause","나뭇잎은 하루 최저기온이 5℃ 아래로 내려가기 시작해야 붉고 노랗게 물든다. 그런데 지구 온난화로 가을까지 더위가 이어지면서 기온이 떨어지는 시기 자체가 늦어지고 있다.")} ${S("cause","최근 5년(2021~2025년) 전국 9월 평균기온은 22.5℃로, 1990년대보다 2.3℃ 높았다.")} ${A("cause","가을까지 더위가 이어지는 근본 원인은 공장·자동차·발전소에서 석탄과 석유 같은 화석 연료를 태울 때 나오는 온실가스가 대기 중에 늘어난 데 있다.")}</p>
<h3>주인공 없는 단풍축제</h3>
<p>${S("state","2024년 10월 말 대구 팔공산 단풍축제는 단풍이 든 나무가 20%도 되지 않은 채 열렸다. 그해 10월 대구의 최저기온은 하루도 5℃ 아래로 내려가지 않았다.")} ${S("effect","축제는 두 달 전부터 준비하기 때문에 날짜를 쉽게 바꿀 수 없다. 단풍을 보러 온 관광객은 실망했고, 축제 대목을 기다린 상인들의 매출도 기대에 미치지 못했다.")}</p>
<p>${S("effect","이듬해인 2025년에도 비슷한 일이 반복됐다. 팔공산 인근 식당 주인은 “단풍만 기다렸는데 막막하다”고 했고, 여행 예약을 취소하는 사람도 늘었다.")} ${A("effect","관광객이 줄면 숙박업소와 식당의 매출이 줄고, 관광 수입에 기대는 지방자치단체의 살림에도 영향을 준다.")} ${S("resp","대구 동구청은 결국 팔공산 단풍축제 날짜를 뒤로 미뤘다.")}</p>
<h3>달라진 가을에 맞추는 방법</h3>
<p>${S("resp","산림청은 해마다 ‘단풍 예측지도’를 내놓고, 관측 지점을 늘려 예측의 정확도를 높이고 있다.")} ${S("resp","경기 연천군은 국화가 늦게 피자 축제 기간을 일주일 연장했고, 이듬해부터는 더 일찍 꽃이 피는 품종으로 바꾸기로 했다.")} ${S("resp","전문가들은 “특정 계절 풍경에만 기대지 말고, 주민이 주도하는 차별화된 축제로 바꿔야 한다”고 조언한다.")}</p>
<p>${A("resp","관광객도 예년 날짜만 믿기보다 예측지도를 확인하고 여행 시기를 정하면 헛걸음을 줄일 수 있다.")} ${A("resp","지역 상인과 관광업체는 단풍 외에도 숲길 걷기, 지역 음식 체험처럼 날씨에 덜 좌우되는 관광 상품을 함께 준비하는 방법을 고민하고 있다.")}</p>
<h3>원인을 줄이는 노력</h3>
<p>${A("resp","피해에 대비하는 것과 함께 원인을 줄이는 노력도 필요하다. 정부는 온실가스 배출을 줄이고 태양광·풍력 같은 재생 에너지를 늘리고 있다. 관광지의 숙박업소와 상점은 에너지를 아끼는 시설로 바꿀 수 있고, 관광객은 자가용 대신 대중교통으로 산을 찾는 것만으로도 온실가스를 줄일 수 있다.")}</p>`,
  q:[
    ["원인","단풍이 들려면 기온이 어떻게 되어야 하는가? 왜 그 시기가 늦어졌는가?",["기온 조건","늦더위"]],
    ["현황","얼마나 늦어졌는가? 숫자로 찾아보자.",["설악산","팔공산"]],
    ["영향","단풍이 늦어져 손해를 본 사람은 누구인가?",["관광객(개인)","상인(기업)","지자체(정부)"]],
    ["대응","각 주체는 어떻게 대응하고 있는가?",["산림청","연천군·대구 동구","관광객·상인"]]
  ],
  think:["축제 날짜를 늦추면 문제가 모두 해결될까? 해마다 단풍 시기가 들쭉날쭉하다면?","단풍 예측지도가 있어도 축제를 두 달 전에 준비해야 한다면 어떤 한계가 있을까?","단풍이 아니어도 사람들이 찾아올 수 있는 축제를 제안해 보자."],

  body:`

<p>${S("cause","지구 온난화로 공기가 머금을 수 있는 수증기가 많아지면서, 짧은 시간에 엄청난 양의 비가 한꺼번에 쏟아지는 극한 호우가 잦아지고 있다.")} ${S("cause","도시의 하수관과 빗물받이는 이렇게 많은 비를 한 번에 처리하도록 만들어지지 않았기 때문에, 배수 능력을 넘어서는 비가 오면 물이 넘친다.")} ${A("cause","도로와 건물이 땅을 덮고 있어 빗물이 땅속으로 스며들지 못하는 것도 원인이다.")} ${A("cause","화석 연료 사용으로 늘어난 온실가스가 지구 온난화를 일으키고, 대기의 흐름을 불안정하게 만들어 집중호우를 더 잦게 한다.")}</p>
<h3>비가 남긴 피해</h3>
<p>${S("effect","2026년 7월 양천구 신월동에는 시간당 최대 63mm의 비가 내렸다. 하수관과 빗물받이가 막혀 물이 빠지지 않고, 가로수가 쓰러지고, 지하 주차장에 물이 차는 등 29건의 피해가 접수됐다.")} ${A("effect","침수가 되면 반지하 주택에 사는 주민이 가장 위험하고, 지하에 있는 상가는 영업을 멈춰야 한다. 정부와 지자체는 복구에 많은 비용을 써야 한다.")} ${A("effect","도로가 통제되고 지하철 운행이 멈추면 시민들의 출퇴근길도 큰 불편을 겪는다.")}</p>
<h3>땅 밑 40m의 빗물 저장고</h3>
<p>${S("resp","양천구에는 땅속 40m 깊이에 지름 10m, 길이 4.7km의 ‘신월 대심도 빗물터널’이 있다. 빗물을 최대 32만 톤까지 담아 둘 수 있어, 이번 폭우 때도 침수 지역의 물이 불어나는 속도를 늦췄다.")}</p>
<p>${S("resp","서울시는 강남역과 광화문 일대에도 같은 빗물터널을 짓고 있다. 2029년까지 주요 공사를 마치고, 완공되면 시간당 110mm의 비까지 견딜 수 있을 것으로 기대된다. 정부는 관련 예산을 올해의 약 4배인 815억 원으로 늘려 편성했다.")}</p>
<p>${S("resp","터널이 완성되기 전까지는 침수 위험이 큰 도로 3곳의 차량 통행을 미리 막고, 내비게이션으로 우회 도로를 안내한다. 도시를 컴퓨터 속에 똑같이 재현해(디지털트윈) 침수를 미리 예측하는 기술도 개발하고 있다.")} ${S("resp","정부와 지자체는 장마철을 앞두고 빗물받이를 청소하고 맨홀 뚜껑에 추락 방지 시설을 설치한다.")}</p>
<p>${A("resp","시민도 빗물받이 위에 쓰레기나 덮개를 올려 두지 않고, 호우 경보가 내리면 지하 주차장·지하차도·반지하 공간을 피하는 것으로 피해를 줄일 수 있다.")}</p>
<h3>원인을 줄이는 노력</h3>
<p>${A("resp","빗물터널은 피해를 줄이는 시설이고, 집중호우의 원인을 줄이는 노력도 함께 필요하다. 정부는 온실가스 감축과 재생 에너지 확대, 기상 관측 강화를 추진한다. 서울시는 빗물이 스며드는 보도블록과 녹지를 늘리고, 기업은 건물과 공장의 안전 점검과 에너지 절약을, 시민은 전기·물 절약과 대중교통 이용을 실천할 수 있다.")}</p>`,
  q:[
    ["원인","도시가 물에 잠기는 이유를 두 가지 이상 찾아보자.",["극한 호우","배수 능력","포장된 땅"]],
    ["현황","어느 정도의 비가 오면 얼마나 잠기는가?",["강남역 실험","양천구 63mm"]],
    ["영향","침수 피해는 누구에게 어떻게 나타나는가?",["반지하 주민(개인)","지하 상가(기업)","지자체 복구(정부)"]],
    ["대응","빗물터널 말고 어떤 대응이 있는가?",["서울시·정부","시민"]]
  ],
  think:["빗물터널은 시간당 110mm까지 견딘다. 그보다 더 많은 비가 오면 어떻게 될까?","터널이 완공되는 2029~2030년까지 남은 기간 동안 어떤 대책이 필요할까?","거대한 터널을 짓는 것 말고, 빗물이 땅으로 스며들게 하는 방법(녹지, 투수 블록 등)은 어떤 효과가 있을까?"],
  src:[
    ["시간당 100mm 폭우에 강남역 최대 1m 침수…실규모 실험으로 확인","동아사이언스","2026.07.29","http://v.daum.net/v/20260729131736715",{cause:"y",state:"y",effect:"n",resp:"y"}],
    ["강남역·광화문 침수 막는다…빗물터널 예산 4배","MTN 머니투데이방송","2026.09.01","http://v.daum.net/v/20260901131005267",{cause:"p",state:"p",effect:"n",resp:"y"}],
    ["주말 ‘극한호우’ 버틴 양천구 대심도터널…“추가 호우까지 대비”","파이낸셜뉴스","2026.07.20","http://v.daum.net/v/20260720155310218",{cause:"p",state:"y",effect:"y",resp:"y"}],
    ["기후1차관, 여름철 집중호우 대비 대심도 빗물터널 현장 점검","(검색 결과)","2026.05.14","http://v.daum.net/v/20260514140229489",{cause:"n",state:"p",effect:"n",resp:"y"}]
  ]
}];

const KEYS=["cause","state","effect","resp"];
const covLabel={y:"",p:"일부",n:"없음"};

function renderGroups(active){
  document.getElementById("groups").innerHTML = G.map(g=>`
    <button class="gbtn" data-id="${g.id}" aria-pressed="${g.id===active}">
      <span class="n">${g.n}</span><span class="r">${g.region}</span><span class="t">${g.type.split(" · ")[1]}</span>
    </button>`).join("");
  document.querySelectorAll(".gbtn").forEach(b=>b.addEventListener("click",()=>select(b.dataset.id,true)));
}

function cov(c){
  return `<div class="cov">${KEYS.map(k=>`<span data-k="${k}" class="${c[k]}" title="${K[k]} ${c[k]==='y'?'있음':c[k]==='p'?'일부':'없음'}">${K[k].replace(" 방안","")}${c[k]==='p'?' 일부':''}${c[k]==='n'?' ✕':''}</span>`).join("")}</div>`;
}

function select(id, push){
  const g = G.find(x=>x.id===id)||G[0];
  renderGroups(g.id);
  const paper=document.getElementById("paper");
  paper.innerHTML = `
    <div class="mast"><b>숭곡 기후 신문</b><span>${g.n} 탐구 기사 · 학습지 유형: ${g.sheet}</span></div>
    <div class="kicker">${g.kicker}</div>
    <h2>${g.title}</h2>
    <p class="dek">${g.dek}</p>
    <div class="byline">수업용 재구성 기사 · 오른쪽 ‘원문 기사’의 사실을 바탕으로 교사가 쉽게 다시 씀</div>
    <div class="fact">${g.facts.map(f=>`<div><div class="v">${f[0]}</div><div class="l">${f[1]}</div></div>`).join("")}</div>
    <div class="tools" role="group" aria-label="형광펜">
      <span class="lab">찾은 뒤 확인하기</span>
      ${KEYS.map(k=>`<button class="hl" data-k="${k}" aria-pressed="false"><i></i>${K[k]}</button>`).join("")}
      <button class="hl all" data-k="all" aria-pressed="false">모두</button>
    </div>
    <div class="article" id="article">${g.body}</div>
    <p class="note">점선 밑줄과 <b style="color:var(--add)">보충</b> 표시가 있는 문장은 원문 기사에 없는 내용을 수업을 위해 덧붙인 것입니다. 발표할 때 근거로 쓰려면 원문 기사나 다른 자료로 확인해 보세요.</p>`;
  const art=document.getElementById("article");
  const btns=[...paper.querySelectorAll(".hl")];
  btns.forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.k;
    if(k==="all"){
      const on=b.getAttribute("aria-pressed")!=="true";
      btns.forEach(x=>x.setAttribute("aria-pressed",on));
      KEYS.forEach(kk=>art.classList.toggle("show-"+kk,on));
    }else{
      const on=b.getAttribute("aria-pressed")!=="true";
      b.setAttribute("aria-pressed",on); art.classList.toggle("show-"+k,on);
      const allOn=KEYS.every(kk=>art.classList.contains("show-"+kk));
      paper.querySelector('.hl.all').setAttribute("aria-pressed",allOn);
    }
  }));

  document.getElementById("side").innerHTML = `
    <section class="box">
      <h4>전개 1 · 기사 분석하기<small>학습지 표에 정리</small></h4>
      <ol class="steps">${g.q.map(q=>`<li><span class="k">${q[0]}</span><div><p>${q[1]}</p><div class="who">${q[2].map(w=>`<span>${w}</span>`).join("")}</div></div></li>`).join("")}</ol>
    </section>
    <section class="box">
      <h4>원문 기사<small>새 창으로 열림</small></h4>
      <ul class="src">${g.src.map(s=>`<li><a href="${s[3]}" target="_blank" rel="noopener">${s[0]}</a><span class="pub">${s[1]} · ${s[2]}</span>${cov(s[4])}</li>`).join("")}</ul>
    </section>`;
  try{localStorage.setItem("climate-group",g.id)}catch(e){}
  if(push){try{history.replaceState(null,"","#"+g.id)}catch(e){}}
}

function renderTeacher(){
  const rows = G.map(g=>{
    const head=`<tr class="gh"><td colspan="6">${g.n} · ${g.region} (${g.type.split(" · ")[1]})</td></tr>`;
    const r=g.src.map(s=>`<tr><td><a href="${s[3]}" target="_blank" rel="noopener">${s[0]}</a></td><td>${s[1]}<br><span style="color:var(--muted)">${s[2]}</span></td>${KEYS.map(k=>`<td class="m ${s[4][k]}">${s[4][k]==='y'?'●':s[4][k]==='p'?'◐':'—'}</td>`).join("")}</tr>`).join("");
    return head+r;
  }).join("");
  document.getElementById("teacherView").innerHTML=`
    <section class="box">
      <h4>검토 결과</h4>
      <p>원문 기사 21건의 본문을 읽고 원인·현황·영향·대응 방안이 들어 있는지 확인했습니다. <b>한 기사만으로 네 요소를 모두, 그리고 개인·기업·정부 주체별로 찾을 수 있는 기사는 거의 없었습니다.</b> 원인·현황을 다루는 기사는 영향과 대응이 비어 있고, 대응 정책 기사는 원인과 현황이 짧은 경우가 대부분이었습니다.</p>
      <p>네 요소가 모두 들어 있는 기사는 농민신문(3모둠)과 영남일보(4모둠) 정도이며, 두 기사도 길고(약 2,500자) 개인 차원의 대응이 빠져 있습니다.</p>
      <p>그래서 모둠마다 원문 3~5건의 사실을 모아 <b>수업용 재구성 기사</b>를 한 편씩 만들었습니다. 원문에 없는 내용(주로 개인 차원의 대응 방안, 6모둠의 2022년 강남역 침수 사례)은 점선 밑줄과 ‘보충’ 표시로 구분했습니다. 수치는 원문 기사에 나온 값을 그대로 옮겼습니다.</p>
      <p>교사용 학습지에 맞춰 모든 기사에 세 가지를 보충했습니다. ① 원인에 ‘화석 연료 → 온실가스 증가 → 지구 온난화’ 연결, ② 학습지의 현황·주체별 영향 중 기사에 없던 내용(단풍 기간 변화, 복숭아 등 과수 북상, 한류성 어종 감소, 농민 생산비, 유통 변화, 영업 중단·이동 불편·복구 비용 등), ③ ‘원인을 줄이는 노력’ 문단(학습지의 일반적인 예방 방안: 정부·기업·개인).</p>
      <p>모둠별 링크: 주소 끝에 <code>#g1</code> ~ <code>#g6</code>을 붙이면 해당 모둠 기사가 바로 열립니다.</p>
    </section>
    <div class="legend"><span><b style="color:var(--c-resp)">●</b> 충분히 있음</span><span><b style="color:var(--c-effect)">◐</b> 일부만 있음(한 줄 언급, 한 주체만)</span><span>— 없음</span></div>
    <div class="tbl"><table>
      <thead><tr><th>원문 기사</th><th>언론사·날짜</th><th>원인</th><th>현황</th><th>영향</th><th>대응</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <section class="box">
      <h4>수업 전 확인할 점</h4>
      <p>‘(검색 결과)’로 표시한 기사 4건은 검색 목록의 제목과 요약만 확인했고, 본문은 읽지 않았습니다.</p>
      <p>4모둠 오징어 수치(723톤, 지난해 2,225톤)는 강원 동해안의 올해 누적 어획량을 지난해 같은 기간과 비교한 값입니다(뉴스1, 2026.8.22 기준).</p>
      <p>6모둠의 강남·광화문 빗물터널은 기사마다 ‘2029년 주요 공사 완료’, ‘2030년 완공’으로 표현이 달라 둘을 함께 적었습니다.</p>
    </section>`;
}

function setView(v){
  const t=v==="teacher";
  document.getElementById("studentView").hidden=t;
  document.getElementById("teacherView").hidden=!t;
  document.getElementById("v-student").setAttribute("aria-pressed",!t);
  document.getElementById("v-teacher").setAttribute("aria-pressed",t);
}
document.getElementById("v-student").addEventListener("click",()=>setView("student"));
document.getElementById("v-teacher").addEventListener("click",()=>setView("teacher"));

renderTeacher();
let start=(location.hash||"").replace("#","");
if(start==="teacher"){setView("teacher");start="";}
if(!G.some(g=>g.id===start)){try{start=localStorage.getItem("climate-group")||"g1"}catch(e){start="g1"}}
select(start,false);
window.addEventListener("hashchange",()=>{const h=location.hash.replace("#","");if(h==="teacher")setView("teacher");else if(G.some(g=>g.id===h)){setView("student");select(h,false)}});
</script>

</body>
</html>
